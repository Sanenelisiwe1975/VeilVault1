[package]
name    = "veilpool-prover-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
veilpool-prover-core = { path = "../prover-core" }

# Same arkworks BLS12-381 Groth16 stack as prover-core/ — must match exactly
# so ProvingKey/Proof types are identical between native and wasm builds.
ark-bls12-381         = "0.4"
ark-groth16           = { version = "0.4", features = ["r1cs"] }
ark-r1cs-std          = "0.4"
ark-relations         = "0.4"
ark-ff                = "0.4"
ark-ec                = "0.4"
ark-std               = "0.4"
ark-serialize         = "0.4"
ark-snark             = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh"] }

sha2       = "0.10"
hex        = "0.4"
rand       = "0.8"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

wasm-bindgen = "0.2"
# rand/ark-std pull in getrandom transitively — wasm32-unknown-unknown has no
# OS RNG, so it needs the "js" backend (crypto.getRandomValues via JS shim).
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
