name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Soroban contract tests ──────────────────────────────────────────────────
  contract-tests:
    name: Soroban Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --features testutils

      - name: Build WASM (check compilation)
        working-directory: contracts
        run: cargo build --release --target wasm32-unknown-unknown

  # ── Backend TypeScript tests ────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Type check
        working-directory: backend
        run: npm run typecheck

      - name: Run tests
        working-directory: backend
        env:
          NODE_ENV: test
          STELLAR_NETWORK: testnet
          STELLAR_RPC_URL: https://soroban-testnet.stellar.org
          STELLAR_HORIZON_URL: https://horizon-testnet.stellar.org
          STELLAR_NETWORK_PASSPHRASE: "Test SDF Network ; September 2015"
          ADMIN_SECRET_KEY: ${{ secrets.TEST_ADMIN_SECRET_KEY }}
          ORACLE_SECRET_KEY: ${{ secrets.TEST_ORACLE_SECRET_KEY }}
          IKA_API_URL: https://api.testnet.ika.xyz
          IKA_API_KEY: ${{ secrets.TEST_IKA_API_KEY }}
          JWT_SECRET: ${{ secrets.TEST_JWT_SECRET }}
          PORT: "3001"
        run: npm test

  # ── SDK type check ──────────────────────────────────────────────────────────
  sdk-typecheck:
    name: SDK Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        working-directory: sdk
        run: npm ci

      - name: Type check & build
        working-directory: sdk
        run: npm run build
