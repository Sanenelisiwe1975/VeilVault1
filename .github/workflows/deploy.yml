name: Deploy to Testnet

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
  workflow_dispatch:
    inputs:
      network:
        description: 'Target network'
        required: true
        default: 'testnet'
        type: choice
        options: [testnet]

jobs:
  deploy-testnet:
    name: Deploy Contracts (Testnet)
    runs-on: ubuntu-latest
    environment: testnet
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts

      - name: Install Stellar CLI
        run: cargo install --locked stellar-cli --features opt

      - name: Run contract tests before deploying
        working-directory: contracts
        run: cargo test --features testutils

      - name: Build optimized WASM
        working-directory: contracts
        run: |
          cargo build --release --target wasm32-unknown-unknown -p x402-verifier
          cargo build --release --target wasm32-unknown-unknown -p dwallet-verifier
          cargo build --release --target wasm32-unknown-unknown -p agent-registry
          cargo build --release --target wasm32-unknown-unknown -p vault
          cargo build --release --target wasm32-unknown-unknown -p strategy-marketplace
          cargo build --release --target wasm32-unknown-unknown -p stokvel-vault
          cargo build --release --target wasm32-unknown-unknown -p zk-attestation
          cargo build --release --target wasm32-unknown-unknown -p privacy-pool
          for contract in vault x402_verifier dwallet_verifier agent_registry strategy_marketplace stokvel_vault zk_attestation privacy_pool; do
            stellar contract optimize --wasm target/wasm32-unknown-unknown/release/${contract}.wasm
          done

      - name: Set up Stellar keys
        # Secrets must be set in the GitHub "testnet" environment:
        #   ADMIN_SECRET_KEY, ORACLE_SECRET_KEY
        env:
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ORACLE_SECRET_KEY: ${{ secrets.ORACLE_SECRET_KEY }}
        run: |
          echo "$ADMIN_SECRET_KEY" | stellar keys add admin --secret-key
          echo "$ORACLE_SECRET_KEY" | stellar keys add oracle --secret-key

      - name: Deploy to testnet
        env:
          ADMIN_SECRET_KEY: ${{ secrets.ADMIN_SECRET_KEY }}
          ORACLE_SECRET_KEY: ${{ secrets.ORACLE_SECRET_KEY }}
        run: bash scripts/deploy-testnet.sh

      - name: Upload deployment artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deployment-info
          path: .env
