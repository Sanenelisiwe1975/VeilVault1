[package]
name    = "veilpool-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "veilpool-prover"
path = "src/main.rs"

[dependencies]
veilpool-prover-core = { path = "../prover-core" }

# arkworks BLS12-381 Groth16 stack
ark-bls12-381       = "0.4"
ark-groth16         = { version = "0.4", features = ["r1cs"] }
ark-r1cs-std        = "0.4"
ark-relations       = "0.4"
ark-ff              = "0.4"
ark-ec              = "0.4"
ark-std             = "0.4"
ark-serialize       = "0.4"
ark-snark           = "0.4"
# SHA-256 R1CS gadget
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh"] }

# utilities
sha2        = "0.10"
hex         = "0.4"
rand        = "0.8"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
clap        = { version = "4", features = ["derive"] }
anyhow      = "1"
