[package]
name    = "veilpool-prover-core"
version = "0.1.0"
edition = "2021"

# Shared circuit/proof-encoding logic, used by both the native CLI (prover/)
# and the browser WASM build (prover-wasm/) — kept dependency-free of clap,
# std::fs, and anything else that's CLI- or native-only.
[dependencies]
ark-bls12-381         = "0.4"
ark-groth16           = { version = "0.4", features = ["r1cs"] }
ark-r1cs-std          = "0.4"
ark-relations         = "0.4"
ark-ff                = "0.4"
ark-ec                = "0.4"
ark-std               = "0.4"
ark-serialize         = "0.4"
ark-snark             = "0.4"
ark-crypto-primitives = { version = "0.4", features = ["r1cs", "crh"] }

sha2       = "0.10"
hex        = "0.4"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
