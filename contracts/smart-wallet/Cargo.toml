[package]
name = "smart-wallet"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
p256 = { version = "0.13.2", features = ["ecdsa"] }
sha2 = { version = "0.10" }
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
testutils = ["soroban-sdk/testutils"]
