[workspace]
members = [
    "vault",
    "x402-verifier",
    "dwallet-verifier",
    "agent-registry",
    "strategy-marketplace",
    "stokvel-vault",
    "zk-attestation",
    "privacy-pool",
    "smart-wallet",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = { version = "22.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
